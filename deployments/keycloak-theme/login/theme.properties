# Тема страницы входа DPmodule (Keycloak 26).
#
# Зачем: вход переведён на платформенный флоу (Authorization Code + PKCE,
# коммит 12ce9f4), логин-форма теперь hosted-страница Keycloak. Своя форма
# возвращена быть не может — пароль не должен проходить через наш код.
# Поэтому фирменный вид восстановлен штатным механизмом Keycloak — темой.
#
# Наследуемся от штатной темы: вся вёрстка, локализация и логика остаются
# родительскими, мы добавляем ТОЛЬКО свой слой стилей поверх. При обновлении
# Keycloak это переживает мажорные версии — в отличие от копирования .ftl.
parent=keycloak
import=common/keycloak

# Порядок важен: сначала родительский login.css, следом наш — он перекрывает.
# css/login.css резолвится из родительской темы, css/dpmodule.css — из нашей.
styles=css/login.css css/dpmodule.css

# Фон со всплывающими словами и блок поддержки рисует скрипт: разметки под них
# в шаблоне Keycloak нет, а копировать template.ftl ради двух блоков — значит
# намертво привязаться к версии. Без JS страница остаётся рабочей, просто без
# этих украшений.
scripts=js/dpmodule-floats.js
