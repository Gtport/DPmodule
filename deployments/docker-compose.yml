version: "3.9"

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8580:8580"
      - "9580:9580"   # /metrics
    volumes:
      - ../config.yaml:/etc/app/config.yaml:ro
      # Лог-файл переживает пересборку контейнера. Приложение пишет и в stdout
      # (его забирает docker logs), и в файл — ротацию делает само.
      - app_logs:/var/log/iqport
    # Секреты приходят из конфига: в нём стоят шаблоны ${vault:...}, которые
    # резолвит CI/CD перед стартом. Переменные окружения — ЗАПАСНОЙ путь для
    # стендов без подстановки; значения сюда не вписывать, передавать снаружи
    # (docker compose подхватит одноимённые из окружения или .env рядом).
    environment:
      PG_PASSWORD: ${PG_PASSWORD:-}
      KEYCLOAK_SA_CLIENT_SECRET: ${KEYCLOAK_SA_CLIENT_SECRET:-}
    # Дублирует HEALTHCHECK из Dockerfile — здесь его видно в docker compose ps
    # и можно переопределить под стенд, не пересобирая образ.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8580/ready"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: on-failure

  # Фронтенд (Angular + nginx) — ОТДЕЛЬНЫЙ контейнер: собранная статика плюс
  # прокси /api на бэкенд.
  #
  # ⚠️ НА СТЕНДЕ фронт и бэк поднимаются РАЗНЫМИ compose-проектами, общей сети
  # между ними нет — там фронт ходит на адрес хоста (дефолт API_BACKEND в его
  # Dockerfile). Этот файл сводит их в одну сеть для ЛОКАЛЬНОЙ проверки пары
  # одной командой, поэтому здесь адрес — имя сервиса.
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-8581}:8581"
    environment:
      # Имя сервиса бэкенда в этой же сети compose (app), порт = http.port из
      # config.yaml. Пересборка образа для этого не нужна — адрес
      # подставляется на старте контейнера (см. frontend/nginx.conf).
      API_BACKEND: app:8580
    # Только порядок запуска. Ждать здоровья бэкенда НЕ нужно: адрес резолвится
    # лениво (см. nginx.conf), поэтому фронт поднимается и отдаёт страницу даже
    # при лежачем бэкенде — /api в это время отвечает 502.
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8581/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: on-failure

volumes:
  app_logs:
