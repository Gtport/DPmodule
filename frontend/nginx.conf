# ШАБЛОН конфига фронт-контейнера. Dockerfile кладёт его в
# /etc/nginx/templates/default.conf.template, entrypoint образа nginx прогоняет
# через envsubst и пишет результат в /etc/nginx/conf.d/default.conf.
# Подставляются ТОЛЬКО ${API_BACKEND} и ${NGINX_LOCAL_RESOLVERS} (фильтр задан
# в Dockerfile) — собственные переменные nginx ($uri, $status, …) остаются как есть.
#
# Контекст http (файл подключается из conf.d, т.е. внутри http) —
# здесь допустимы map и log_format.

# Сквозной request-id: если фронт/edge уже прислал X-Request-Id — переиспользуем,
# иначе генерим nginx'ом ($request_id). По нему 5xx в этом логе связывается с
# ошибкой в логе Go-бэкенда (DevOps: «на каждый 5xx ↔ ошибка в беке»).
map $http_x_request_id $req_id {
    default   $request_id;
    "~."      $http_x_request_id;
}

# JSON-лог: статус ответа фронту + upstream-статус/время бэкенда + request_id.
log_format iqport_json escape=json '{'
    '"time":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"method":"$request_method",'
    '"uri":"$uri",'
    '"status":$status,'
    '"upstream_addr":"$upstream_addr",'
    '"upstream_status":"$upstream_status",'
    '"upstream_response_time":"$upstream_response_time",'
    '"request_time":$request_time,'
    '"request_id":"$req_id",'
    '"bytes_sent":$body_bytes_sent,'
    '"referer":"$http_referer",'
    '"user_agent":"$http_user_agent"'
'}';

# Метрики фронта — на ОТДЕЛЬНОМ порту 9581 (как у бэкенда: 8580 API / 9580 метрики),
# чтобы наружу через ingress торчал только 8581, а сбор шёл по внутреннему порту.
server {
    listen 9581;
    server_name _;

    # Prometheus опрашивает раз в 15 с — в лог доступа это лишний шум.
    access_log off;

    # Формат Prometheus собираем сами из переменных модуля stub_status: он есть
    # в стандартном nginx, а отдельный exporter ставить не требуется.
    # ⚠️ Здесь только соединения; счётчика обработанных запросов у nginx в
    # переменных нет — если понадобится, ставится nginx-prometheus-exporter
    # поверх /stub_status ниже.
    location = /metrics {
        default_type text/plain;
        return 200 "# HELP nginx_connections_active Активные клиентские соединения.\n# TYPE nginx_connections_active gauge\nnginx_connections_active $connections_active\n# HELP nginx_connections_reading Соединения, у которых читается запрос.\n# TYPE nginx_connections_reading gauge\nnginx_connections_reading $connections_reading\n# HELP nginx_connections_writing Соединения, в которые пишется ответ.\n# TYPE nginx_connections_writing gauge\nnginx_connections_writing $connections_writing\n# HELP nginx_connections_waiting Простаивающие keep-alive соединения.\n# TYPE nginx_connections_waiting gauge\nnginx_connections_waiting $connections_waiting\n# HELP nginx_up Признак живости фронт-контейнера.\n# TYPE nginx_up gauge\nnginx_up 1\n";
    }

    # Родной stub_status: счётчики accepts/handled/requests в текстовом виде.
    # Нужен, если поверх поставят nginx-prometheus-exporter.
    location = /stub_status {
        stub_status;
    }

    # На порту метрик больше ничего не отдаём — приложение живёт на 8581.
    location / {
        return 404;
    }
}

server {
    # Порт модуля DPPort на стенде: фронт 8581 (бэкенд — 8580, метрики 9581).
    # ${TLS_MODE}: пусто (дефолт) — обычный http, как на всех наших стендах;
    # «ssl» — этот ЖЕ порт говорит https. Платформенный паттерн корп-прода:
    # деплой публикует порты 1:1 (8581→8581), отдельный https-порт ему
    # неудобен — так же живёт соседний RTport. Включив ssl здесь, сертификат
    # подать обязательно (см. ниже).
    listen 8581 ${TLS_MODE};

    # HTTPS того же приложения — 8543 (для стендов, где удобнее отдельный
    # порт: внешний 8581 → контейнерный 8543). Блок ОДИН на все порты: нет
    # второй копии локаций, которую пришлось бы править синхронно с этой.
    # Вход в модуль работает ТОЛЬКО по https (или localhost): PKCE требует
    # Web Crypto API, а браузер даёт его лишь в безопасном контексте — боевой
    # случай 18.08.2026, белый экран «Web Crypto API is not available» на
    # http://IP:8581.
    # В образе лежит серт-ЗАГЛУШКА (см. Dockerfile): контейнер без настоящего
    # сертификата поднимается и работает по http как раньше, а https просто не
    # публикуют. Боевой сертификат подаётся ОДНИМ из двух способов:
    #   а) монтировать пофайлово на дефолтные имена заглушки —
    #      /etc/certs/dpport-frontend-production.crt → /etc/nginx/certs/tls.crt
    #      /etc/certs/dpport-frontend-production.key → /etc/nginx/certs/tls.key
    #   б) платформенный: примонтировать папку (-v /etc/certs:/etc/nginx/certs:ro)
    #      и указать реальные имена через -e TLS_CERT=… -e TLS_KEY=… (envsubst их
    #      подставит ниже; дефолты в Dockerfile указывают на заглушку).
    listen 8543 ssl;
    ssl_certificate     ${TLS_CERT};
    ssl_certificate_key ${TLS_KEY};
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:2m;
    ssl_session_timeout 10m;

    # Голый http://, пришедший на https-порт (старая закладка, набрали руками),
    # получает не страницу ошибки 400, а редирект на https того же адреса.
    # $http_host — «хост:порт», как их набрал клиент, то есть ВНЕШНИЙ адрес,
    # а не контейнерный $server_port.
    error_page 497 =301 https://$http_host$request_uri;

    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Логи фронт-контейнера. Путь можно примонтировать на volume или оставить как
    # есть (в nginx:alpine эти файлы симлинкнуты в stdout) — решает DevOps.
    access_log /var/log/nginx/access.log iqport_json;
    error_log  /var/log/nginx/error.log warn;

    # Отдаём request_id обратно — удобно цитировать в баг-репорте/поддержке.
    add_header X-Request-Id $req_id always;

    # Сжатие статики. В образе nginx оно ВЫКЛЮЧЕНО по умолчанию (проверено:
    # ответ на Accept-Encoding: gzip приходил без Content-Encoding), а жмётся
    # наша сборка хорошо: критический путь до первого экрана 1288 КБ → 172 КБ
    # (в 7,5 раза), styles.css 611 КБ → 75 КБ. Заметно тому, кто открывает
    # модуль через ingress, а не по локальной сети.
    # ⚠️ gzip_types перечисляем явно: по умолчанию nginx жмёт ТОЛЬКО text/html,
    # то есть без этой строки js и css поехали бы несжатыми (ровно так и
    # происходит сейчас на VPS-стенде, где отдаёт системный nginx).
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # SPA fallback — все маршруты отдаём index.html (Angular router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Бандлы Angular именуются хешем содержимого (chunk-34CEETII.js), поэтому
    # кэшировать их можно навсегда: новый деплой = новые имена, старый кэш
    # никого не держит. index.html при этом НЕ кэшируется (ниже) — именно это
    # и делает вечный кэш остальных файлов безопасным.
    # Экономия здесь не в трафике (без этих заголовков nginx шлёт ETag, и
    # браузер получает 304 без тела), а в 49 лишних переспросах на каждый F5.
    location ~* \.(js|css|woff2?|png|jpg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Проксирование API модуля на его Go-бэкенд (см. IQPort §7.2).
    # Адрес приходит переменной API_BACKEND, дефолт — в Dockerfile.
    #
    # На стенде фронт и бэк живут в РАЗНЫХ compose-проектах, общей сети между
    # ними нет (то же решение, что и для похода к rwgate), поэтому по умолчанию
    # адресуемся к хосту стенда, а не к имени сервиса. Свяжут сети — достаточно
    # передать имя сервиса переменной, пересобирать образ не нужно.
    #
    # ⚠️ Адрес подставляется в proxy_pass ТОЛЬКО через переменную ($api_backend),
    # и это не украшательство. Литеральное ИМЯ (proxy_pass http://api-backend:8580)
    # nginx резолвит при СТАРТЕ и падает с «host not found in upstream», если
    # бэкенда ещё нет в DNS: фронт уходит в crash-loop и не отдаёт даже страницу
    # логина (проверено запуском). С IP-адресом этого не видно — резолвить нечего,
    # — но ровно в момент перехода на имя сервиса грабля и срабатывает. С
    # переменной резолв ленивый, на каждый запрос через resolver ниже: контейнер
    # спокойно поднимается один, а пока бэкенд не встал, /api отвечает 502.
    # $request_uri обязателен: с переменной nginx сам путь не подставляет.
    # ^~ (а не просто /api/) — чтобы регулярка статики выше НЕ перехватывала
    # запросы к API: regex-локации nginx проверяет РАНЬШЕ префиксных, и ручка
    # вида /api/v1/report.png уехала бы в раздачу файлов вместо бэкенда.
    # Сегодня таких ручек нет, но ^~ снимает вопрос навсегда.
    location ^~ /api/ {
        # DNS-серверы контейнера (docker подставляет свой). valid= задаёт, как
        # долго держать ответ — иначе адрес пересозданного бэкенда не подхватится.
        # resolver_timeout — потолок ожидания DNS: без него неверное имя держит
        # запрос 30 с (проверено) вместо быстрого 502.
        resolver ${NGINX_LOCAL_RESOLVERS} valid=10s;
        resolver_timeout 5s;
        set $api_backend "${API_BACKEND}";

        # ⚠️ Умолчание nginx — 1 МБ, и этого НЕ хватает: реальный отчёт ЛК
        # (_data/lk/1126022_010826-0619.xlsx) весит 1,22 МБ, то есть загрузка
        # отлетала бы с 413, не дойдя до бэкенда. Локально через ng serve
        # лимита нет вовсе — поломка вылезла бы только на стенде. Берём с
        # запасом, чтобы отказ по размеру выдавал бэкенд со своим текстом.
        client_max_body_size 16m;

        proxy_pass http://$api_backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Тот же id уходит в бэкенд — он логирует его рядом с ошибкой.
        proxy_set_header X-Request-Id $req_id;
    }

    # Не кэшируем index.html, чтобы клиент сразу видел новый деплой
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
