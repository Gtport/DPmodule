host: localhost:8080
info:
  contact: {}
  description: IQPort microservice template.
  title: IQPort Service API
  version: "1.0"
paths:
  /api/v1/admin/tables:
    get:
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_Gtport_DPmodule_internal_domain.AdminTable'
            type: array
      security:
      - BearerAuth: []
      summary: Реестр редактируемых справочников (list_tables)
      tags:
      - admin
  /api/v1/admin/tables/{table}:
    get:
      responses:
        "200":
          description: OK
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Колонки и строки справочника
      tags:
      - admin
  /api/v1/cargo-work/{date}/{terminal}:
    delete:
      parameters:
      - description: ЖД-сутки, ГГГГ-ММ-ДД
        in: path
        name: date
        required: true
        type: string
      - description: Терминал (ports.name_s)
        in: path
        name: terminal
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: оператору доступны только вчерашние сутки
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Удалить учёт суток по терминалу (выгрузка и погрузка)
      tags:
      - cargo-work
    get:
      parameters:
      - description: ЖД-сутки, ГГГГ-ММ-ДД
        in: path
        name: date
        required: true
        type: string
      - description: Терминал (ports.name_s)
        in: path
        name: terminal
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Gtport_DPmodule_internal_service.CargoWorkDayDTO'
      security:
      - BearerAuth: []
      summary: Учётный лист «Грузовой работы» терминала за сутки
      tags:
      - cargo-work
    put:
      parameters:
      - description: ЖД-сутки, ГГГГ-ММ-ДД
        in: path
        name: date
        required: true
        type: string
      - description: Терминал (ports.name_s)
        in: path
        name: terminal
        required: true
        type: string
      - description: Ручные поля по линиям
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_Gtport_DPmodule_internal_service.CargoWorkManual'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Gtport_DPmodule_internal_service.CargoWorkDayDTO'
        "403":
          description: оператору доступны только вчерашние сутки
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 'Правка учётного листа (только ручные поля: план, факт выгрузки, комментарий,
        погрузка)'
      tags:
      - cargo-work
  /api/v1/cargo-work/{date}/{terminal}/recalc:
    post:
      parameters:
      - description: ЖД-сутки, ГГГГ-ММ-ДД
        in: path
        name: date
        required: true
        type: string
      - description: Терминал (ports.name_s)
        in: path
        name: terminal
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Gtport_DPmodule_internal_service.CargoWorkDayDTO'
        "403":
          description: оператору доступны только вчерашние сутки
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Пересчитать авто-слой суток (прибытие, выгрузка по станции, аналитика);
        ручные поля сохраняются
      tags:
      - cargo-work
  /api/v1/dislocation/arrivals:
    get:
      parameters:
      - description: 'начало периода yyyy-MM-dd (дефолт: вчера)'
        in: query
        name: from
        type: string
      - description: 'конец периода yyyy-MM-dd (дефолт: сегодня)'
        in: query
        name: to
        type: string
      - description: терминалы через запятую (АЭ,ГУТ-2); пусто — все
        in: query
        name: naznach
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Gtport_DPmodule_internal_service.ArrivalsDTO'
      security:
      - BearerAuth: []
      summary: Прибывшие поезда за период (группы index_pp+date_prib из vagon_history)
      tags:
      - dislocation
  /api/v1/dislocation/arrivals/cancel:
    post:
      parameters:
      - description: vagon_ids
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.dismissRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Gtport_DPmodule_internal_service.ArrivalsUpdateResult'
      security:
      - BearerAuth: []
      summary: 'Отмена прибытия: снимок 10→9 (вагон снова кандидат) + очистка вехи
        в истории'
      tags:
      - dislocation
  /api/v1/dislocation/arrivals/candidates:
    get:
      parameters:
      - description: терминалы через запятую; пусто — все
        in: query
        name: naznach
        type: string
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_Gtport_DPmodule_internal_service.CandidateGroupDTO'
            type: array
      security:
      - BearerAuth: []
      summary: Кандидаты в прибывшие (статус 9 из снимка, минус отклонённые)
      tags:
      - dislocation
  /api/v1/dislocation/arrivals/confirm:
    post:
      parameters:
      - description: vagon_ids + фактическое время
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_Gtport_DPmodule_internal_service.ConfirmArrivalRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Gtport_DPmodule_internal_service.ArrivalsUpdateResult'
      security:
      - BearerAuth: []
      summary: 'Подтверждение прибытия кандидатов (в снимок: статус 10 + date_prib;
        веха в историю)'
      tags:
      - dislocation
  /api/v1/dislocation/arrivals/dismiss:
    post:
      parameters:
      - description: vagon_ids
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.dismissRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Gtport_DPmodule_internal_service.ArrivalsUpdateResult'
      security:
      - BearerAuth: []
      summary: Отклонение кандидатов («скрыть до новых данных», вагоны остаются 9)
      tags:
      - dislocation
  /api/v1/dislocation/arrivals/vagons:
    put:
      parameters:
      - description: vagon_ids + применяемые поля
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_Gtport_DPmodule_internal_service.ArrivalsUpdateRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Gtport_DPmodule_internal_service.ArrivalsUpdateResult'
      security:
      - BearerAuth: []
      summary: Правка выбранных вагонов истории прибывших (прибытие/отмена/выгрузка/назначение)
      tags:
      - dislocation
  /api/v1/dislocation/asu/pull:
    post:
      responses:
        "200":
          description: OK
          schema:
            type: object
        "409":
          description: рассогласование меток формирования источников
          schema:
            type: object
        "502":
          description: АСУ недоступна / ошибка забора
          schema:
            type: object
        "503":
          description: источник АСУ не настроен
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: 'Автозагрузка дислокации из АСУ-АСУ (cron): забор + сверка меток +
        снимок'
      tags:
      - dislocation
  /api/v1/dislocation/bros/active:
    get:
      responses:
        "200":
          description: OK
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Активные брошенные поезда
      tags:
      - bros
  /api/v1/dislocation/bros/filter:
    get:
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Броски по фильтру (терминал/период/статус) — отчёт
      tags:
      - bros
  /api/v1/dislocation/bros/history:
    get:
      responses:
        "200":
          description: OK
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: История брошенных (завершённые)
      tags:
      - bros
  /api/v1/dislocation/bros/journal:
    get:
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: История журнала броска
      tags:
      - bros
    post:
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Запись в журнал броска (фиксация состояния оператором)
      tags:
      - bros
  /api/v1/dislocation/bros/journal/bulk-save:
    post:
      responses:
        "200":
          description: OK
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Массовая фиксация журнала за сегодня (перед рассылкой в MAX)
      tags:
      - bros
  /api/v1/dislocation/bros/reason-codes:
    get:
      responses:
        "200":
          description: OK
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Справочник кодов бросания (классификатор РЖД)
      tags:
      - bros
  /api/v1/dislocation/bros/report:
    get:
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Отчёт по броскам за период с разбивкой суток по кодам
      tags:
      - bros
  /api/v1/dislocation/bros/search:
    get:
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Поиск брошенных по индексу (подстрока)
      tags:
      - bros
  /api/v1/dislocation/delays/current:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_Gtport_DPmodule_internal_domain.VagonDelayRow'
            type: array
