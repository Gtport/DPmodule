# Конфиг для локальной разработки (WSL). Скопировать в config.local.yaml
# и запускать бэкенд с ним:
#
#     go run ./cmd/server -config config.local.yaml
#
# config.local.yaml — вне git (см. .gitignore), поэтому боевой config.yaml
# не мешается в diff'ах и не уезжает в PR с локальными адресами.
#
# ⚠️ Главное отличие от боевого: ВСЕ исходящие интеграции выключены.
# Локальный инстанс не должен ни ходить к провайдеру АСУ, ни слать формы в MAX —
# чаты и получатели там настоящие, а крон «Брошенные» второй раз запишет журнал.

app:
  name: iqport-service
  env: dev

http:
  host: 127.0.0.1
  port: 8080
  read_timeout: 10s
  write_timeout: 30s
  shutdown_timeout: 15s

metrics:
  port: 9090

# Секреты: на стендах их объявляют шаблоном Vault ${vault:<движок>/<путь>:<ключ>},
# который резолвит CI/CD перед стартом (см. config.yaml). На машине
# разработчика подставлять некому, поэтому здесь работает запасной путь — пустое
# поле в конфиге и значение в переменной окружения из ./.env.
postgres:
  enabled: true
  host: localhost
  port: 5432          # локальный Postgres в WSL, НЕ туннель к боевой базе.
                      # Свежий кластер встаёт на 5433, если 5432 занят — проверить
                      # командой pg_lsclusters и поставить сюда порт своего кластера
  dbname: dpport
  user: gtport_app
  # password: ...     # пусто → берётся env PG_PASSWORD из ./.env (так и оставляем локально)
  sslmode: disable
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 5m

# Локальной копии БД тайлов в WSL не держим (docs/MAP_TILES.md): карта работает
# без подложки (маркеры на пустом фоне), тайлы смотрим на VPS после деплоя.
tiles:
  enabled: false

# Экран «Карта» целиком (решение владельца 07.08.2026): enabled: false выключает
# роуты карты и подключение к БД тайлов, фронт прячет пункт меню «Карты».
# Блок отсутствует = карта включена.
map:
  enabled: true

keycloak:
  enabled: true
  # service_account (исходящие походы к провайдеру) локально НЕ заполняем: обе
  # интеграции выключены ниже, ходить некуда. Пустой блок = режим X-API-Key.
  jwks_url: http://localhost:8180/realms/iqport/protocol/openid-connect/certs
  # issuer обязан совпадать с KC_HOSTNAME локального Keycloak + /realms/iqport.
  # Локально точка входа — dev-сервер Angular (он же проксирует /realms на :8180),
  # поэтому и в .env Keycloak'а стоит KC_HOSTNAME=http://localhost:4200.
  issuer: http://localhost:4200/realms/iqport
  audience: iqport-backend

log:
  # debug здесь уместен: на машине разработчика трасса SQL и есть то, ради чего
  # уровень включают. На бою (config.vps.yaml) — info, иначе файл забивается.
  level: debug
  format: text             # text — колонки для человека (по умолчанию); json — для сборщика логов
  file: logs/service.log
  max_size_mb: 100
  max_backups: 5
  max_age_days: 30
  slow_query: 500ms        # дольше — запрос пишется как медленный (Warn); отрицательное — выключить

# ---- исходящие интеграции: на локальной машине выключены ----

asu:
  enabled: false        # крон забора дислокации. Данные берём из копии боевой базы
  pull_interval: 10m    # (scripts/dev_db_refresh.sh) либо заливкой файла ЛК руками.
  pull_offset: 5m

lk_robot:
  enabled: false        # робот ЛК ходит в настоящий кабинет РЖД под живым аккаунтом:
                        # включать только осознанно, для проверки самого робота

wagonops:
  enabled: false        # запрос 601 к провайдеру: очередь общая с боевой, дублировать незачем
  drain_interval: 15s
  batch: 50
  pause: 500ms
  max_attempts: 5

reference:
  enabled: false
  base_url: ""
  insecure_tls: false
  pull_interval: 1h
  initial_lookback: 48h # окно первого захода (курсора нет); глубже задержки публикации провайдера
  cursor_overlap: 30m   # нахлёст курсора на запоздавшие записи
  stale_after: 6h       # молчание дольше — пустой проход в журнал
  clients: [attis, nmtp]

gu2b:                   # уведомления ГУ-2б (факт выгрузки) — как и прочие интеграции, в WSL выключено
  enabled: false
  base_url: ""
  insecure_tls: false
  pull_interval: 1h
  clients: [attis, nmtp]
  apply: false

max:
  enabled: false        # ⚠️ true = реальная рассылка в реальные чаты MAX. Не включать.
  base_url: https://platform-api2.max.ru
  timeout_secs: 120
  send_delay: 500ms

bros:
  enabled: false        # ежедневный bulk-save журнала — дело боевого инстанса
  journal_cron: "01:00"

notifications:          # внутренние уведомления (колокольчик); подсистема без внешних вызовов
  enabled: true         # false прячет ручки и колокольчик фронта
  retention_hours: 72   # срок хранения (решение владельца); purge освобождает dedup-ключи
  cleanup_interval: 1h  # тик крона очистки и сторожей
  stale_after: 2h       # сторож устаревания снимка дислокации; отрицательное = выключен
