app:
  name: iqport-service
  env: dev

http:
  port: 8580
  read_timeout: 10s
  write_timeout: 30s
  shutdown_timeout: 15s

metrics:
  port: 9580   # отдельный порт для /metrics; задать = http.port, чтобы отдавать на основном

# Конфиг ДЕВ-СТЕНДА (корпоративный контур). Файл называется config.yaml и лежит
# В GIT (решение владельца 03.08.2026): его забирает CI/CD под этим именем.
# Конфиг боевого VPS — config.vps.yaml, машины разработчика — config.local.yaml.
# Включены база и Keycloak; исходящие интеграции (АСУ,
# памятки, MAX, крон «Брошенные») намеренно выключены — второй инстанс не должен
# слать формы в живые чаты и дублировать забор данных у провайдера.
#
# Секреты объявляются шаблоном Vault ${vault:<движок>/<путь>:<ключ>} и резолвятся
# CI/CD перед стартом — в самом приложении резолвинга нет, значение читается как есть.
# Пусто → запасной путь: одноимённая переменная окружения (PG_PASSWORD и т.д.).
# ⚠️ Пути ниже — по образцу шаблона, конкретные согласовать с DevOps.
postgres:
  enabled: true
  host: 176.53.160.9  # база стенда; НЕ localhost — из контейнера это он сам
  port: 5432
  dbname: kgdm        # база общая с соседями, наши таблицы — в схеме dpport
  user: gtport_app
  # Ключ секрета = имя роли БД (конвенция хранилища: один секрет на путь,
  # ключи — по пользователям: dbadmin, kgdm, teh_user…).
  password: ${vault:kv/databases/postgres/dev:gtport_app}
  sslmode: disable
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 5m

# Кэш тайлов OSM для карты (docs/MAP_TILES.md). На стенде тайлы живут в общей
# базе kgdm в своей схеме — точные имена базы/схемы за DevOps (решение владельца
# 06.08.2026); пароль не задан → берётся postgres.password (роль та же).
tiles:
  enabled: false
  host: 176.53.160.9
  port: 5432
  dbname: kgdm      # уточнить у DevOps
  schema: dpport    # уточнить у DevOps
  user: gtport_app
  sslmode: disable

keycloak:
  enabled: true
  # Значения сверены с живым токеном (Client scopes → Evaluate, клиент iqport-dpport):
  # issuer сравнивается ДОСЛОВНО со строкой из токена — подставлять IP нельзя,
  # Keycloak выдаёт токены с внешним именем (KC_HOSTNAME), хотя отвечает и по адресу.
  jwks_url: https://uport1.ru/realms/iqport/protocol/openid-connect/certs
  issuer: https://uport1.ru/realms/iqport
  # aud токена = ["iqport-dpport", "account"]; проверка включена и закрывает
  # «токен другого модуля того же realm'а проходит на наш API» (в realm живут
  # и соседи — в токене видны их роли view_sspr / view_rtport).
  audience: iqport-dpport
  # Общий realm: в нём живут легаси-роли всего контура (admin/operator/dispatcher)
  # и роли соседей — из токена принимаются только точные имена *_dpport.
  strict_roles: true
  # client_secret приложению НЕ нужен: входящие токены проверяются публичными
  # ключами из JWKS. Поле осталось от шаблона, кодом не используется.
  # service_account — ИСХОДЯЩИЕ походы к провайдеру (дислокация, запрос 601, памятки):
  # поток client_credentials, человек в цикле не нужен → работает и в кронах.
  # ⚠️ Заполненность блока = переключатель режима: пока token_url/client_id пусты,
  # клиенты ходят запасным X-API-Key. Заполнять, КОГДА клиент с включённым
  # Service accounts roles реально заведён, иначе интеграции встанут на авторизации.
  service_account:
    token_url: https://uport1.ru/realms/iqport/protocol/openid-connect/token
    client_id: iqport_dpport_service   # клиент с включённым Service accounts roles
    insecure_tls: false             # true для самоподписанного серта Keycloak на стенде
    timeout_secs: 30
    client_secret: ${vault:kv/authorization/keycloak/dev:dpport_service}

log:
  level: info
  file: /var/log/iqport/service.log
  max_size_mb: 100
  max_backups: 5
  max_age_days: 30

asu:
  enabled: false        # true → фоновый забор дислокации из АСУ по тикеру
  pull_interval: 10m    # период забора (источники — в таблице data_source)
  # Авторизация у провайдера — Keycloak, сервис-аккаунт (keycloak.service_account).
  # X-API-Key в конфиге не объявляется: он остался ЗАПАСНЫМ режимом для отката
  # (data_source.config.auth_mode = "apikey") и берёт ключ из окружения по имени,
  # которое объявил источник (data_source.auth_secret_key).

reference:              # памятки на подачу/уборку (тот же провайдер, что дислокация)
  enabled: false        # true → фоновый крон-инкремент по тикеру
  # Провайдер тот же, что у дислокации (rwgate), но адрес задаётся ЗДЕСЬ, а не в
  # data_source: у памяток нет реестра источников. При смене адреса править оба места.
  base_url: https://176.53.160.9:8521/api/v1  # схема, порт и путь — как в config.vps.yaml
  insecure_tls: true    # самоподписанный серт провайдера на IP (аналог curl -k)
  pull_interval: 1h     # период крон-инкремента
  initial_lookback: 48h # окно первого захода (курсора нет); глубже задержки публикации провайдера
  cursor_overlap: 30m   # нахлёст курсора на запоздавшие записи
  stale_after: 6h       # молчание дольше — пустой проход в журнал
  clients: [attis, nmtp] # коды клиентов провайдера: памятки разнесены по клиентам, у каждого свои номера
  # auth_mode: keycloak | apikey — пусто значит keycloak, если сервис-аккаунт настроен
  # auth_secret_key — только для запасного режима apikey: ИМЯ ключа (дефолт
  # ASU_TOKEN), значение читается из одноимённой переменной окружения

max:                    # рассылка форм в мессенджер MAX
  enabled: false        # включается в конфиге per-deployment; чаты/маршруты — в БД
  base_url: https://platform-api2.max.ru  # Bot API MAX (CA Минцифры вшит в бинарь)
  timeout_secs: 120     # таймаут HTTP (заливка картинок бывает долгой)
  send_delay: 500ms     # пауза между чатами (лимит API 30 rps)
  bot_token: ${vault:kv/integrations/max/dev:bot_token}   # токен бота
